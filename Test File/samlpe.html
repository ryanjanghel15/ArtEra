<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Form</title>
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e2e0d8;
      --border-focus: #a0998a;
      --text: #1a1917;
      --text-muted: #6b6860;
      --accent: #2a2724;
      --accent-fg: #ffffff;
      --success-bg: #eaf3de;
      --success-text: #3b6d11;
      --error-bg: #fcebeb;
      --error-text: #a32d2d;
      --radius: 10px;
      --font: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── Card ──────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 520px;
    }

    .card-header {
      margin-bottom: 2rem;
    }

    .card-header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .card-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Form fields ───────────────────────────────────────── */
    #form-fields {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: fadeSlide 0.25s ease forwards;
      opacity: 0;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .field-group label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .field-group input {
      font-family: var(--font);
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem 0.85rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }

    .field-group input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(42,39,36,0.07);
    }

    .field-group input.error {
      border-color: #e24b4a;
      background: #fff8f8;
    }

    /* ── Submit button ─────────────────────────────────────── */
    #submit-btn {
      margin-top: 1.75rem;
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: var(--accent-fg);
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #submit-btn:hover { opacity: 0.87; }
    #submit-btn:active { transform: scale(0.985); }
    #submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Status banner ─────────────────────────────────────── */
    #status {
      display: none;
      margin-top: 1rem;
      padding: 0.65rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
    }

    #status.success { display: block; background: var(--success-bg); color: var(--success-text); }
    #status.error   { display: block; background: var(--error-bg);   color: var(--error-text); }

    /* ── Skeleton loader ───────────────────────────────────── */
    .skeleton {
      height: 52px;
      background: linear-gradient(90deg, #ece9e3 25%, #e2dfd8 50%, #ece9e3 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius);
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    /* ── Spinner ───────────────────────────────────────────── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet" />
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>Submit your data</h1>
    <p id="subtitle">Loading fields from spreadsheet…</p>
  </div>

  <div id="form-fields">
    <!-- Skeleton placeholders while headers load -->
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <button id="submit-btn" disabled>Send to spreadsheet</button>
  <div id="status"></div>
</div>

<script>

</script>
</body>
</html>
